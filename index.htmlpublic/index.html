const act=i.mine?`<p class="tag pill">This is your listing</p><button class="btn ok" id="rs">Mark as Resolved</button>`

:`<label>Verification: ${esc(i.challenge)}</label><textarea id="ans" rows="3" maxlength="500" placeholder="Your answer…"></textarea><div class="err" id="er"></div><button class="btn" id="cl">Submit Claim Verification Request</button>`;

$('#app').innerHTML=`<h1>My Dashboard</h1><div class="tabs">${[['items','My listings'],['rec','Claims to review'],['sent','My requests']].map(t=>`<button class="tab ${dtab===t[0]?'on':''}" onclick="dtab='${t[0]}';dash()">${t[1]}</button>`).join('')}</div><div id="dl"><div class="sk"></div></div>`;
try{const d=await api('/dashboard');const E=(i,m)=>`<div class="empty"><i>${i}</i>${m}</div>`;let h='';
if(dtab==='items')h=d.myItems.map(i=>`<div class="item"><span class="tag ${i.type}">${i.type.toUpperCase()}</span><span class="tag pill">${i.status}</span><b> ${esc(i.title)}</b><div style="color:var(--mut)">${ic('pin')} ${esc(i.venue)} · ${i.pending} pending claim(s)</div>${i.status==='active'?`<button class="btn ok" style="margin-top:8px" onclick="resolve(${i.id},this)">Mark Resolved</button>`:''}</div>`).join('')||E(ic('inbox'),'You haven\'t posted anything yet.');
if(dtab==='rec')h=d.received.map(c=>`<div class="item"><b>${esc(c.title)}</b> <span class="tag pill">${c.status}</span><div style="color:var(--mut);font-size:14px">${esc(c.challenge)}</div><p>${ic('msg')} <b>${esc(c.alias)}:</b> ${esc(c.answer)}</p>${c.status==='pending'&&c.itemStatus==='active'?`<div class="row"><button class="btn ok" onclick="decide(${c.id},'approve',this)">Approve</button><button class="btn no" onclick="decide(${c.id},'reject',this)">Reject</button></div>`:''}${c.status==='approved'?`<button class="btn" onclick="thread(${c.id})">Open private thread</button>`:''}</div>`).join('')||E(ic('shield'),'No claim requests yet.');
if(dtab==='sent')h=d.sent.map(c=>`<div class="item"><b>${esc(c.title)}</b> <span class="tag pill">${c.status}</span><div style="color:var(--mut);font-size:14px">${ic('pin')} ${esc(c.venue)} · Your answer: ${esc(c.answer)}</div>${c.status==='approved'?`<button class="btn" style="margin-top:8px" onclick="thread(${c.id})">Open private thread</button>`:''}</div>`).join('')||E(ic('search'),'You haven\'t claimed anything yet.');
$('#dl').innerHTML=h}catch(e){$('#dl').innerHTML=`<div class="empty"><i>${ic('warn')}</i>${esc(e.message)}</div>`}}
const decide=(id,d,b)=>busy(b,async()=>{await api(`/claims/${id}/decision`,{decision:d});toast(d==='approve'?'Approved. A private thread is now open.':'Claim rejected.');dash()});
const resolve=(id,b)=>busy(b,async()=>{await api(`/items/${id}/resolve`,{});toast('Resolved');dash()});

/* ---------- THREAD ---------- */
async function thread(id){openM('<div class="sk"></div>');
const draw=async()=>{try{const t=await api(`/claims/${id}/thread`);const box=$('#ch'),keep=box?box.scrollTop:0,had=!!box;
if(!had)$('#mb').innerHTML=`<h3>${ic('lock')} ${esc(t.title)}</h3><p style="color:var(--mut);margin:0">You are the <b>${t.role}</b>. Identities stay hidden.</p><p id="mu"></p><div class="chat" id="ch"></div><div class="row" style="margin-top:8px"><input id="mi" maxlength="500" placeholder="Type a message…" style="flex:1"><button class="btn" id="ms">Send</button></div><label>Propose a meetup checkpoint</label><div class="row"><select id="cp" style="flex:1">${META.checkpoints.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn alt" id="cs">Set</button></div><div class="err" id="er"></div>${t.resolved?'<p>'+ic('check')+' This item is resolved.</p>':'<button class="btn ok" style="margin-top:10px;width:100%" id="rv">Item returned — Mark Resolved</button>'}`;
$('#mu').innerHTML=t.meetup?`${ic('pin')} <b>Agreed checkpoint:</b> ${esc(t.meetup)}${CPH[t.meetup]?`<img class="cpimg" src="${imgUrl(CPH[t.meetup])}" alt="">`:''}`:'No checkpoint chosen yet.';
$('#ch').innerHTML=t.messages.map(m=>`<div class="m ${m.mine?'me':''}"><small>${m.mine?'You':m.who} · ${ago(m.createdAt)}</small>${m.body.startsWith('Proposed meetup:')?ic('pin')+' ':''}${esc(m.body)}</div>`).join('')||'<div class="empty"><i>'+ic('msg')+'</i>Say hello</div>';
$('#ch').scrollTop=had?keep:1e9;
if(!had){$('#ms').onclick=e=>busy(e.target,async()=>{await api(`/claims/${id}/messages`,{body:$('#mi').value});$('#mi').value='';await draw();$('#ch').scrollTop=1e9},$('#er'));
$('#cs').onclick=e=>busy(e.target,async()=>{await api(`/claims/${id}/meetup`,{checkpoint:$('#cp').value});await draw()},$('#er'));
if($('#rv'))$('#rv').onclick=e=>busy(e.target,async()=>{await api(`/items/${t.itemId}/resolve`,{});toast('Resolved');closeM();dash()},$('#er'))}}catch(e){$('#mb').innerHTML=`<div class="empty"><i>${ic('warn')}</i>${esc(e.message)}</div>`;clearInterval(poll)}};
await draw();clearInterval(poll);if(window.EventSource&&!window.DEMO_OTP){const es=new EventSource(`/api/claims/${id}/stream`);es.onmessage=()=>draw();window.ES=es;poll=setInterval(draw,20000)}else poll=setInterval(draw,4000)}

/* ---------- ADMIN ---------- */
async function adminPage(){if(!ME||!ME.isAdmin){location.hash='#/';return}
$('#app').innerHTML='<h1>Moderation</h1><div id="al"><div class="sk"></div></div>';
try{const{reports}=await api('/admin/reports');$('#al').innerHTML=reports.map(r=>`<div class="item"><span class="tag ${r.type}">${r.type.toUpperCase()}</span><b> ${esc(r.title)}</b> <span class="tag pill">${r.n} report(s)</span><div style="color:var(--mut)">${ic('pin')} ${esc(r.venue)}</div><p>${esc(r.description)}</p><p><b>Reason:</b> ${esc(r.reason)}</p><div class="row"><button class="btn no" onclick="adm('/admin/items/${r.itemId}/remove',this,'Listing removed.')">Remove listing</button><button class="btn alt" onclick="adm('/admin/reports/${r.id}/dismiss',this,'Report dismissed.')">Dismiss</button></div></div>`).join('')||`<div class="empty"><i>${ic('shield')}</i>No open reports. Campus is tidy.</div>`}catch(e){$('#al').innerHTML=`<div class="empty"><i>${ic('warn')}</i>${esc(e.message)}</div>`}}
const adm=(u,b,m)=>busy(b,async()=>{await api(u,{});toast(m);adminPage()});

/* ---------- ROUTER ---------- */
async function route(){closeM();scrollTo(0,0);const r=(location.hash.slice(2)||'').split('?')[0];
document.querySelectorAll('nav a[href^="#"]').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+r));
({'':home,board,post,dash,login:()=>loginPage(0),register:()=>loginPage(1),verify:verifyPage,forgot:forgotPage,admin:adminPage}[r]||home)()}
(async()=>{try{[META,{user:ME}]=await Promise.all([api('/meta'),api('/me')])}catch(e){$('#app').innerHTML='<div class="empty"><i>'+ic('warn')+'</i>Cannot reach the server. Is it running?</div>';return}
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));renderAuth();addEventListener('hashchange',route);route()})();
</script><script>(()=>{const app=$('#app'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const st=document.createElement('style');st.textContent=[...Array(12)].map((_,i)=>`.grid>*{animation:rise .6s both}.grid>*:nth-child(${i+1}){animation-delay:${i*.05}s}`).join('');document.head.append(st);
const spot=document.createElement('div');spot.id='spot';document.body.append(spot);
let _e,_r=0;addEventListener('pointermove',E=>{_e=E;if(_r)return;_r=requestAnimationFrame(()=>{_r=0;const e=_e;spot.style.transform=`translate(${e.clientX-300}px,${e.clientY-300}px)`;const c=e.target.closest?.('.card,.cat,.item');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');if(!reduce&&!c.classList.contains('item'))c.style.transform=`perspective(700px) rotateX(${(.5-y)*10}deg) rotateY(${(x-.5)*12}deg) translateY(-4px)`})});
addEventListener('pointerout',e=>{const c=e.target.closest?.('.card,.cat');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
addEventListener('click',e=>{const b=e.target.closest?.('.btn');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.append(s);setTimeout(()=>s.remove(),600)});
const tk=document.createElement('div');tk.id='ticker';document.querySelector('nav').after(tk);
async function tick(){try{const{items}=await api('/items');tk.innerHTML=items.length?`<span class="live"><i></i>LIVE</span><div class="trk"><div>${[...items.slice(0,12),...items.slice(0,12)].map(i=>`<span>${ic(i.type==='found'?'box':'search')} <b class="tag ${i.type}">${i.type}</b> ${esc(i.title)} · ${esc(i.venue)} · ${ago(i.createdAt)}</span>`).join('')}</div></div>`:''}catch{}}
tick();setInterval(tick,20000);addEventListener('hashchange',()=>setTimeout(tick,500));
function typer(el,w){let a=0,c=0,d=0;(function f(){if(!el.isConnected)return;const s=w[a];el.textContent=s.slice(0,c);if(!d&&c===s.length){d=1;return setTimeout(f,1400)}if(d&&!c){d=0;a=(a+1)%w.length}c+=d?-1:1;setTimeout(f,d?45:90)})()}
function cu(el,to){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1300);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
async function hero(h){const h1=h.querySelector('h1'),box=h1.parentElement;h1.insertAdjacentHTML('afterend','<div class="rot">Find your <b id="rw"></b></div>');typer($('#rw'),['ID card','room key','calculator','earphones','wallet','lab equipment']);
try{const[l,f]=await Promise.all([api('/items?type=lost'),api('/items?type=found')]);const nv=Object.values(META.venues).flat().length;
const s=document.createElement('div');s.className='stats';s.innerHTML=[['Lost reports',l.items.length],['Found items',f.items.length],['Campus venues',nv],['Categories',META.categories.length]].map((x,i)=>`<div style="animation-delay:${.2+i*.1}s"><b>0</b><small>${x[0]}</small></div>`).join('');box.append(s);s.querySelectorAll('b').forEach((b,i)=>cu(b,[l.items.length,f.items.length,nv,META.categories.length][i]))}catch{}}
new MutationObserver(()=>{app.classList.remove('pg');void app.offsetWidth;app.classList.add('pg');const h=app.querySelector('.hero');if(h)hero(h)}).observe(app,{childList:true});
function boom(){if(reduce)return;const c=document.createElement('canvas');c.id='cf';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext('2d'),P=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*18,vy:-Math.random()*17-4,s:5+Math.random()*5,r:Math.random()*6,h:Math.random()*360}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=`hsl(${p.h},90%,60%)`;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++n<120)requestAnimationFrame(f);else c.remove()})()}
const _t=toast;toast=function(t,b){_t(t,b);if(!b&&/resolved|updated|verified/i.test(t))boom()}})();
</script><script>(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('off',!e.isIntersecting)));
const watch=()=>document.querySelectorAll('.sticky,.hero h1,.hero .float').forEach(el=>io.observe(el));
new MutationObserver(watch).observe($('#app'),{childList:true});watch();
let t;addEventListener('scroll',()=>{document.body.classList.add('sc');clearTimeout(t);t=setTimeout(()=>document.body.classList.remove('sc'),160)},{passive:true});
new MutationObserver(()=>document.body.classList.toggle('mo',$('#modal').classList.contains('open'))).observe($('#modal'),{attributes:true,attributeFilter:['class']})})();
</script><script>{const im=new Image();im.onload=()=>document.documentElement.classList.add('has-hero');im.src='/img/hero.jpg'}</script></body></html>
